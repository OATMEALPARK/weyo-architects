<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>WE.YO Image Migration</title>
  <style>
    :root{--bg:#f5f4f0;--ink:#171717;--muted:#706e67;--line:#d7d3ca;--ok:#1f6b42;--bad:#9a352f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}
    main{max-width:760px;margin:0 auto;padding:28px 20px 70px}
    h1{font:400 clamp(34px,7vw,58px)/1 "Times New Roman",serif;margin:18px 0 14px}
    p{line-height:1.7}
    .muted{color:var(--muted)}
    .card{border:1px solid var(--line);background:#fff8;padding:20px;margin-top:18px}
    input,button{font:inherit}
    input{width:100%;padding:12px;border:1px solid var(--line);background:white}
    button{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:12px 16px;cursor:pointer}
    button.secondary{background:transparent;color:var(--ink)}
    button:disabled{opacity:.45;cursor:not-allowed}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row>*{flex:1 1 180px}
    .status{margin-top:12px;white-space:pre-wrap;word-break:break-word}
    .progress{height:9px;background:#e5e1d8;margin:18px 0 8px;overflow:hidden}
    .bar{height:100%;width:0;background:#171717;transition:width .2s}
    .log{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:#111;color:#eee;padding:14px;max-height:340px;overflow:auto;white-space:pre-wrap}
    .ok{color:var(--ok)} .bad{color:var(--bad)}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
  </style>
</head>
<body>
<main>
  <div class="muted">ONE-TIME TOOL · WE.YO</div>
  <h1>Wix → Supabase<br>Image Migration</h1>
  <p>프로젝트 이미지를 Wix CDN에서 Supabase Storage로 복사하고, <code>projects.images</code> 경로를 새 Storage 경로로 교체합니다. 프로젝트 하나의 이미지가 모두 업로드된 뒤에만 DB를 갱신합니다.</p>

  <section class="card" id="loginCard">
    <b>1. 관리자 로그인</b>
    <p class="muted">WE.YO CMS 관리자 이메일을 입력하면 매직링크를 보냅니다.</p>
    <div class="row">
      <input id="email" type="email" placeholder="관리자 이메일">
      <button id="loginBtn">SEND MAGIC LINK</button>
    </div>
    <div id="loginStatus" class="status muted"></div>
  </section>

  <section class="card" id="runCard" hidden>
    <b>2. 이미지 이전</b>
    <p id="who" class="muted"></p>
    <div id="summary">확인 중…</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="progressText" class="muted">대기 중</div>
    <div class="row" style="margin-top:16px">
      <button id="startBtn">MIGRATE IMAGES</button>
      <button id="logoutBtn" class="secondary">LOGOUT</button>
    </div>
    <div id="runStatus" class="status"></div>
    <div id="log" class="log" style="margin-top:16px"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
const SB_URL='https://rmtfmegufylujrzuvczi.supabase.co';
const SB_KEY='sb_publishable_Zh_DVcw1aX3mUkCTQg8WLw_WNiPyuhz';
const BUCKET='project-media';
const WIX='https://static.wixstatic.com/media/';
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const isWix=v=>!!v&&(v.includes('~mv2.')||v.startsWith(WIX));
const sourceUrl=v=>v.startsWith('http')?v:WIX+v.replace(/^\/+/,'');
const safeName=v=>{
  const raw=(v.split('/').pop()||'image.jpg').split('?')[0];
  try{return decodeURIComponent(raw).replace(/[^A-Za-z0-9._-]/g,'-')}
  catch{return raw.replace(/[^A-Za-z0-9._-]/g,'-')}
};
const log=msg=>{
  const t=new Date().toLocaleTimeString();
  $('#log').textContent+=`[${t}] ${msg}\n`;
  $('#log').scrollTop=$('#log').scrollHeight;
};
const setProgress=(done,total,label='')=>{
  const pct=total?Math.round(done/total*100):0;
  $('#bar').style.width=pct+'%';
  $('#progressText').textContent=`${done} / ${total} (${pct}%)${label?' · '+label:''}`;
};

async function requireAdmin(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return null;
  const {data,error}=await sb.from('cms_admin_emails').select('email').eq('email',(user.email||'').toLowerCase()).maybeSingle();
  if(error||!data){await sb.auth.signOut();return null}
  return user;
}
async function loadSummary(){
  const {data,error}=await sb.from('projects').select('id,slug,title,images').order('list_order',{ascending:true});
  if(error)throw error;
  const wix=(data||[]).reduce((n,p)=>n+(p.images||[]).filter(isWix).length,0);
  const total=(data||[]).reduce((n,p)=>n+(p.images||[]).length,0);
  $('#summary').innerHTML=`프로젝트 <b>${data.length}</b>개 · 이미지 <b>${total}</b>장 · Wix 남은 이미지 <b>${wix}</b>장`;
  return {projects:data||[],wix,total};
}

async function uploadOne(project, ref, index){
  if(!isWix(ref))return ref;
  const src=sourceUrl(ref);
  const dest=`migrated/${project.slug}/${String(index+1).padStart(3,'0')}-${safeName(ref)}`;
  const response=await fetch(src,{mode:'cors',cache:'no-store'});
  if(!response.ok)throw new Error(`Wix 다운로드 실패 ${response.status}: ${src}`);
  const blob=await response.blob();
  const type=(blob.type||response.headers.get('content-type')||'image/jpeg').split(';')[0];

  const {error}=await sb.storage.from(BUCKET).upload(dest,blob,{
    contentType:type,
    cacheControl:'31536000',
    upsert:true
  });
  if(error)throw new Error(`Storage 업로드 실패: ${dest} / ${error.message}`);
  return dest;
}

async function mapLimit(items,limit,fn){
  const out=new Array(items.length);
  let next=0;
  const workers=Array.from({length:Math.min(limit,items.length)},async()=>{
    while(true){
      const i=next++;
      if(i>=items.length)return;
      out[i]=await fn(items[i],i);
    }
  });
  await Promise.all(workers);
  return out;
}

async function migrateProject(project,onOneDone){
  const refs=project.images||[];
  if(!refs.some(isWix)){log(`SKIP ${project.slug} · 이미 이전됨`);return 0}
  log(`START ${project.slug} · ${refs.filter(isWix).length}장`);
  let migrated=0;
  const newImages=await mapLimit(refs,3,async(ref,i)=>{
    const wasWix=isWix(ref);
    const path=await uploadOne(project,ref,i);
    if(wasWix){migrated++;onOneDone(project.title)}
    return path;
  });
  const {error}=await sb.from('projects').update({images:newImages}).eq('id',project.id);
  if(error)throw new Error(`DB 업데이트 실패 ${project.slug}: ${error.message}`);
  log(`DONE  ${project.slug} · ${migrated}장`);
  return migrated;
}

async function migrateHeroOverrides(){
  const {data,error}=await sb.from('homepage_hero').select('slot,desktop_image,mobile_image');
  if(error)throw error;
  for(const row of data||[]){
    const patch={};
    for(const key of ['desktop_image','mobile_image']){
      const ref=row[key];
      if(!isWix(ref))continue;
      const src=sourceUrl(ref);
      const dest=`migrated/homepage/slot-${row.slot}-${key}-${safeName(ref)}`;
      const response=await fetch(src,{mode:'cors',cache:'no-store'});
      if(!response.ok)throw new Error(`Hero Wix 다운로드 실패: slot ${row.slot}`);
      const blob=await response.blob();
      const {error:upErr}=await sb.storage.from(BUCKET).upload(dest,blob,{
        contentType:(blob.type||'image/jpeg').split(';')[0],cacheControl:'31536000',upsert:true
      });
      if(upErr)throw upErr;
      patch[key]=dest;
    }
    if(Object.keys(patch).length){
      const {error:uErr}=await sb.from('homepage_hero').update(patch).eq('slot',row.slot);
      if(uErr)throw uErr;
    }
  }
}

$('#loginBtn').onclick=async()=>{
  const email=$('#email').value.trim();
  if(!email)return $('#loginStatus').textContent='이메일을 입력해줘.';
  $('#loginBtn').disabled=true;
  $('#loginStatus').textContent='매직링크 보내는 중…';
  const redirectTo=location.origin+location.pathname;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:true}});
  $('#loginBtn').disabled=false;
  $('#loginStatus').textContent=error?error.message:'메일로 온 WE.YO CMS 로그인 링크를 눌러줘.';
};

$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};

$('#startBtn').onclick=async()=>{
  $('#startBtn').disabled=true;
  $('#runStatus').textContent='';
  $('#log').textContent='';
  try{
    const user=await requireAdmin();
    if(!user)throw new Error('관리자 세션이 아니야. 다시 로그인해줘.');
    const {projects,wix}=await loadSummary();
    if(!wix){
      $('#runStatus').innerHTML='<span class="ok">이미 Wix 이미지가 0장이야. 이전 완료 상태.</span>';
      setProgress(0,0,'완료');
      return;
    }
    let done=0;
    setProgress(done,wix);
    for(const project of projects){
      await migrateProject(project,label=>{done++;setProgress(done,wix,label)});
    }
    await migrateHeroOverrides();
    const after=await loadSummary();
    if(after.wix!==0)throw new Error(`이전 후에도 Wix 이미지 ${after.wix}장이 남아 있음`);
    setProgress(wix,wix,'완료');
    $('#runStatus').innerHTML='<span class="ok"><b>완료.</b> DB 기준 Wix 이미지 0장.</span>';
    log('ALL DONE · Wix refs = 0');
  }catch(err){
    console.error(err);
    $('#runStatus').innerHTML='<span class="bad"><b>중단:</b> '+String(err?.message||err)+'</span>';
    log('ERROR '+String(err?.message||err));
  }finally{
    $('#startBtn').disabled=false;
  }
};

(async()=>{
  const user=await requireAdmin();
  if(user){
    $('#loginCard').hidden=true;
    $('#runCard').hidden=false;
    $('#who').textContent=`로그인: ${user.email}`;
    try{await loadSummary()}catch(e){$('#summary').textContent='확인 실패: '+e.message}
  }else{
    $('#loginCard').hidden=false;
    $('#runCard').hidden=true;
  }
})();
</script>
</body>
</html>

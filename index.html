<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WE.YO ARCHITECTS</title><style>:root {
  --bg: #f5f4f0;
  --paper: #fbfaf7;
  --ink: #151515;
  --muted: #66645e;
  --line: rgba(21,21,21,.23);
  --pad: clamp(20px, 3.2vw, 56px);
  --serif: 'Times New Roman', 'Noto Serif KR', serif;
  --sans: Arial, 'Helvetica Neue', 'Noto Sans KR', sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover;background:#ddd8cf}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:#1c1c1c;color:#fff}

.site-header{position:fixed;z-index:50;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:22px var(--pad);color:var(--ink);transition:color .48s cubic-bezier(.22,.61,.36,1),background .38s ease,border-color .38s ease}
.site-header.on-hero{color:#fff}
.site-header.hero-dark{color:#fff}
.site-header.hero-light{color:var(--ink)}
.site-header.scrolled{background:rgba(245,244,240,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,.08);color:var(--ink)}
.brand{font-size:18px;letter-spacing:.02em;font-weight:600}
.desktop-nav{display:flex;gap:34px;font-size:11px;letter-spacing:.13em}
.desktop-nav a,.mobile-menu a,.filter-btn,.text-link{position:relative}
.desktop-nav a:after,.text-link:after{content:'';position:absolute;left:0;right:100%;bottom:-3px;border-bottom:1px solid currentColor;transition:right .3s ease}
.desktop-nav a:hover:after,.text-link:hover:after{right:0}
.mobile-toggle{display:none;width:27px;height:17px;position:relative}.mobile-toggle span{display:block;width:100%;height:1px;background:currentColor;transform-origin:center;transition:transform .28s ease,opacity .2s ease}.mobile-toggle.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}.mobile-toggle.open span:nth-child(2){opacity:0}.mobile-toggle.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.mobile-menu{position:fixed;z-index:45;inset:0;background:var(--bg);padding:110px var(--pad) 40px;display:flex;flex-direction:column;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity .3s ease}
.mobile-menu.open{opacity:1;pointer-events:auto}
.mobile-menu nav{display:flex;flex-direction:column;gap:18px;font-family:var(--serif);font-size:clamp(38px,12vw,64px);line-height:1}
.mobile-menu small{font-size:10px;letter-spacing:.14em;text-transform:uppercase}

.hero{position:relative;height:100svh;min-height:640px;background:#111;overflow:hidden;color:#fff}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.15s ease;z-index:1;background-size:cover;background-position:center;background-repeat:no-repeat}
.hero-slide.active{opacity:1;z-index:2}
.hero-slide:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 50%,rgba(0,0,0,.34) 100%)}
.hero-slide img{position:absolute;inset:0}
.hero-meta{position:absolute;z-index:4;left:var(--pad);right:var(--pad);bottom:30px;display:grid;grid-template-columns:110px 1fr auto;align-items:end;gap:24px}
.hero-count{font-size:10px;letter-spacing:.12em}
.hero-title{font-family:var(--serif);font-size:clamp(30px,4vw,62px);line-height:.95;font-weight:400}
.hero-info{text-align:right;font-size:10px;letter-spacing:.08em;text-transform:uppercase;line-height:1.7}
.hero-controls{position:absolute;z-index:8;right:var(--pad);bottom:118px;display:flex;gap:16px;font-size:10px;letter-spacing:.1em}
.hero-controls button{color:#fff}

.statement{padding:clamp(120px,17vw,260px) var(--pad);display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.statement-mark{grid-column:1/5;font-family:var(--serif);font-size:clamp(72px,11vw,168px);line-height:.8;font-weight:400}
.statement-copy{grid-column:7/12;align-self:end;padding-top:110px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
.statement-copy p{font-family:var(--serif);font-size:clamp(22px,2.25vw,36px);line-height:1.42;margin:0;word-break:keep-all}
.statement-copy .small-ko{margin-top:34px;max-width:520px;font-family:var(--sans);font-size:14px;line-height:1.9;color:#4e4d48}

.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 var(--pad) 70px;padding-top:8px;border-top:1px solid var(--line)}
.section-head h2{font-size:11px;letter-spacing:.14em;font-weight:400;margin:14px 0 0}
.section-head span{font-size:10px;letter-spacing:.1em;color:var(--muted)}
.selected{padding:0 0 clamp(150px,20vw,300px)}
.work-item{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin:0 var(--pad) clamp(110px,14vw,210px)}
.work-media{overflow:hidden;background:#ddd7cc}
.work-media img{transition:transform .8s cubic-bezier(.2,.65,.2,1)}
.work-item:hover .work-media img{transform:scale(1.018)}
.work-caption{padding-top:14px;border-top:1px solid var(--line);margin-top:10px;display:flex;justify-content:space-between;gap:20px}
.work-caption h3{font-family:var(--serif);font-size:clamp(20px,2vw,30px);font-weight:400;margin:0}
.work-caption p{margin:2px 0 0;text-align:right;font-size:9px;letter-spacing:.1em;line-height:1.7;text-transform:uppercase;color:var(--muted)}
.work-item:nth-child(1) .work-block{grid-column:1/10}
.work-item:nth-child(2) .work-block{grid-column:7/13}
.work-item:nth-child(3) .work-block{grid-column:2/13}
.work-item:nth-child(4) .work-block{grid-column:1/7}
.work-item:nth-child(5) .work-block{grid-column:5/12}
.work-item:nth-child(1) .work-media{aspect-ratio:16/10}
.work-item:nth-child(2) .work-media{aspect-ratio:4/5}
.work-item:nth-child(3) .work-media{aspect-ratio:17/9}
.work-item:nth-child(4) .work-media{aspect-ratio:4/5}
.work-item:nth-child(5) .work-media{aspect-ratio:16/10}

.all-projects-cta{margin:0 var(--pad) clamp(150px,17vw,260px);padding:26px 0 30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-size:clamp(34px,6vw,92px);line-height:1}
.all-projects-cta span:last-child{font-family:var(--sans);font-size:20px}

.studio-tease{padding:0 var(--pad) clamp(150px,18vw,280px);display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.studio-tease .left{grid-column:1/4;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.studio-tease .right{grid-column:6/13}
.phrase-line1,.phrase-line2{display:inline}.studio-tease blockquote{font-family:var(--serif);font-size:clamp(28px,4vw,58px);line-height:1.18;margin:0 0 40px;max-width:1000px}

.footer{border-top:1px solid var(--line);margin:0 var(--pad);padding:28px 0 38px;display:grid;grid-template-columns:1.4fr 1.25fr 1fr 1.35fr;gap:28px;font-size:10px;line-height:1.8;letter-spacing:.04em}
.footer .footer-kicker{font-family:var(--serif);font-size:16px;line-height:1.35;letter-spacing:0}
.footer .footer-label{display:block;margin-bottom:8px;font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.footer .right{text-align:right}
.footer .copyright{font-size:9px;color:var(--muted);line-height:1.7}

.page-main{padding-top:130px;min-height:80vh}
.page-title{margin:0 var(--pad) 100px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px;align-items:end}
.page-title h1{grid-column:1/7;font-family:var(--serif);font-size:clamp(70px,12vw,180px);font-weight:400;line-height:.8;margin:0}
.page-title p{grid-column:9/13;margin:0 0 8px;font-size:12px;line-height:1.8;color:var(--muted)}
.filters{display:flex;gap:28px;margin:0 var(--pad) 56px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.filter-btn{font-size:10px;letter-spacing:.13em;color:var(--muted)}
.filter-btn.active{color:var(--ink)}
.filter-btn.active:after{content:'';position:absolute;left:0;right:0;bottom:-5px;border-bottom:1px solid var(--ink)}
.archive-grid{margin:0 var(--pad) 180px;display:grid;grid-template-columns:1fr 1fr;column-gap:32px;row-gap:90px}
.archive-card{display:block}
.archive-image{aspect-ratio:4/3;overflow:hidden;background:#ddd8cf}
.archive-card:nth-child(4n+2) .archive-image,.archive-card:nth-child(4n+3) .archive-image{aspect-ratio:5/6}
.archive-image img{transition:transform .7s ease}
.archive-card:hover img{transform:scale(1.018)}
.archive-caption{display:flex;justify-content:space-between;gap:20px;padding-top:12px;border-top:1px solid var(--line);margin-top:9px}
.archive-caption strong{font-family:var(--serif);font-size:20px;font-weight:400}
.archive-caption span{text-align:right;font-size:9px;line-height:1.7;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.detail-hero{height:92svh;min-height:620px;background:#ddd8cf}
.detail-hero img{object-fit:cover}
.detail-intro{padding:70px var(--pad) 140px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.detail-title{grid-column:1/8;font-family:var(--serif);font-size:clamp(54px,8vw,128px);font-weight:400;line-height:.9;margin:0;word-break:keep-all}
.detail-meta-top{grid-column:9/13;align-self:end;font-size:10px;line-height:1.8;letter-spacing:.09em;text-transform:uppercase}
.detail-info{margin:0 var(--pad) 120px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:36px}
.info-cell label{display:block;font-size:9px;letter-spacing:.13em;color:var(--muted);margin-bottom:8px}
.info-cell div{font-size:12px}
.detail-description{margin:0 var(--pad) 160px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.detail-description p{grid-column:6/11;font-family:var(--serif);font-size:clamp(20px,2.2vw,34px);line-height:1.55;margin:0;word-break:keep-all}
.gallery{padding-bottom:160px}
.gallery-row{margin-bottom:clamp(60px,9vw,140px);padding:0 var(--pad);display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.gallery-row.full{padding:0}
.gallery-row.full .gallery-img{grid-column:1/13;aspect-ratio:16/9}
.gallery-row.wide .gallery-img{grid-column:2/12;aspect-ratio:16/10}
.gallery-row.portrait .gallery-img{grid-column:7/12;aspect-ratio:4/5}
.gallery-row.pair .gallery-img:first-child{grid-column:1/7;aspect-ratio:4/5}
.gallery-row.pair .gallery-img:last-child{grid-column:7/13;aspect-ratio:4/5}
.project-nav{margin:0 var(--pad) 80px;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase}

.studio-grid{margin:0 var(--pad) 180px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.studio-word{grid-column:1/6;font-family:var(--serif);font-size:clamp(72px,11vw,164px);line-height:.8}
.studio-philosophy{grid-column:7/12;padding-top:120px}
.studio-philosophy p{font-family:var(--serif);font-size:clamp(24px,2.5vw,38px);line-height:1.5;margin:0;word-break:keep-all}
.people{margin:0 var(--pad) 180px;border-top:1px solid var(--line)}
.person{padding:28px 0 62px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.person h2{grid-column:1/5;font-family:var(--serif);font-size:clamp(28px,3.5vw,52px);font-weight:400;margin:0}
.person .bio{grid-column:7/12;display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:11px;line-height:1.8}
.person .bio b{font-size:9px;letter-spacing:.12em;font-weight:400;color:var(--muted);display:block;margin-bottom:8px}
.contact-wrap{margin:0 var(--pad) 180px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px;min-height:52vh}
.contact-primary{grid-column:1/7;font-family:var(--serif);font-size:clamp(38px,6vw,90px);line-height:1.05}
.contact-list{grid-column:8/13;align-self:end;border-top:1px solid var(--line)}
.contact-row{display:grid;grid-template-columns:1fr 2fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);font-size:11px}
.contact-row span:first-child{font-size:9px;letter-spacing:.12em;color:var(--muted)}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}
.reveal.visible{opacity:1;transform:none}

@media(max-width: 820px){
  :root{--pad:20px}
  .desktop-nav{display:none}
  .mobile-toggle{display:flex;flex-direction:column;justify-content:space-between;z-index:90}
  .site-header{padding:18px 20px;z-index:100}
  .mobile-menu{z-index:80;padding:108px 20px 36px}
  body.menu-open .site-header{color:var(--ink)!important;background:transparent;border-color:transparent}
  .hero{min-height:560px}
  .hero-meta{left:20px;right:20px;bottom:90px;display:block}
  .hero-count{display:block;margin-bottom:12px;font-size:10px;letter-spacing:.12em}
  .hero-title{display:block;max-width:calc(100vw - 40px);font-size:clamp(38px,11vw,50px);line-height:1.02;word-break:keep-all}
  .hero-info{display:block;text-align:left;margin-top:18px;font-size:10px;line-height:1.65}
  .hero-controls{right:20px;bottom:28px;gap:24px;font-size:10px}
  .brand-phrase .phrase-line1,.footer-kicker .phrase-line1{display:block;white-space:nowrap}
  .brand-phrase .phrase-line2,.footer-kicker .phrase-line2{display:block;white-space:nowrap;word-break:keep-all}
  .statement{display:block;padding:120px 20px 150px}
  .statement-mark{font-size:28vw;margin-bottom:120px}
  .statement-copy{padding:0}
  .statement-copy p{font-size:28px;line-height:1.45}
  .section-head{margin:0 20px 54px}
  .work-item{display:block;margin:0 20px 100px}
  .work-item .work-block{width:100%}
  .work-item:nth-child(n) .work-media{aspect-ratio:4/3}
  .work-caption{display:block}.work-caption p{text-align:left;margin-top:10px}
  .all-projects-cta{margin:0 20px 150px;font-size:48px}
  .studio-tease{display:block;padding:0 20px 150px}.studio-tease .left{margin-bottom:70px}.phrase-line1,.phrase-line2{display:inline}.studio-tease blockquote{font-size:34px}
  .footer{margin:0 20px;grid-template-columns:1fr 1fr;gap:30px 20px}.footer .middle{display:block}.footer .right{text-align:left}.footer .copyright{grid-column:1/-1}
  .page-main{padding-top:110px}
  .page-title{display:block;margin:0 20px 76px}.page-title h1{font-size:22vw;margin-bottom:46px}.page-title p{max-width:360px}
  .filters{margin:0 20px 42px;gap:19px}
  .archive-grid{margin:0 20px 120px;grid-template-columns:1fr;row-gap:70px}.archive-card:nth-child(n) .archive-image{aspect-ratio:4/3}
  .detail-hero{height:76svh;min-height:500px}
  .detail-intro{display:block;padding:48px 20px 90px}.detail-title{font-size:15vw;margin-bottom:44px}.detail-meta-top{font-size:9px}
  .detail-info{margin:0 20px 90px;grid-template-columns:1fr 1fr;gap:28px 20px}
  .detail-description{display:block;margin:0 20px 110px}.detail-description p{font-size:24px}
  .gallery{padding-bottom:100px}.gallery-row{display:block;padding:0 20px;margin-bottom:64px}.gallery-row.full{padding:0}.gallery-row:nth-child(n) .gallery-img{aspect-ratio:auto}.gallery-img img{height:auto}
  .gallery-row.pair .gallery-img+ .gallery-img{margin-top:20px}
  .project-nav{margin:0 20px 60px}
  .studio-grid{display:block;margin:0 20px 120px}.studio-word{font-size:24vw;margin-bottom:100px}.studio-philosophy{padding:0}.studio-philosophy p{font-size:27px}
  .people{margin:0 20px 120px}.person{display:block}.person h2{margin-bottom:44px}.person .bio{display:grid;grid-template-columns:1fr;gap:28px}
  .contact-wrap{display:block;margin:0 20px 120px;min-height:55vh}.contact-primary{font-size:13vw;margin-bottom:120px}.contact-list{margin-top:80px}.contact-row{font-size:13px;align-items:center}.contact-row span:first-child{font-size:10px;line-height:1}.contact-row span:last-child{line-height:1.3}
}

const hd=document.querySelector('.site-header'),hero=document.querySelector('.hero');
function setHeroHeaderTone(slide){
  if(!hero||!slide||scrollY>hero.offsetHeight-90)return;
  const bg=(slide.style.backgroundImage||'').match(/url\([\"']?(.*?)[\"']?\)/);
  if(!bg||!bg[1]){hd.classList.add('hero-dark');hd.classList.remove('hero-light');return;}
  const img=new Image();
  img.crossOrigin='anonymous';
  img.onload=()=>{
    try{
      const cw=Math.min(240,img.naturalWidth),ch=Math.min(90,img.naturalHeight);
      const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d',{willReadFrequently:true});
      const viewW=innerWidth,viewH=hero.clientHeight,ir=img.naturalWidth/img.naturalHeight,vr=viewW/viewH;
      let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
      if(ir>vr){sw=img.naturalHeight*vr;sx=(img.naturalWidth-sw)/2}else{sh=img.naturalWidth/vr;sy=(img.naturalHeight-sh)/2}
      const headerH=Math.min(120,viewH);const sampleH=Math.max(1,sh*(headerH/viewH));
      x.drawImage(img,sx,sy,sw,sampleH,0,0,cw,ch);
      const d=x.getImageData(0,0,cw,ch).data;let total=0,count=0;
      for(let i=0;i<d.length;i+=16){const r=d[i],g=d[i+1],b=d[i+2];total+=(0.2126*r+0.7152*g+0.0722*b);count++;}
      const light=total/count>155;
      hd.classList.toggle('hero-light',light);hd.classList.toggle('hero-dark',!light);
    }catch(e){hd.classList.add('hero-dark');hd.classList.remove('hero-light')}
  };
  img.onerror=()=>{hd.classList.add('hero-dark');hd.classList.remove('hero-light')};
  img.src=bg[1];
}
if(hero){hd.classList.add('on-hero','hero-dark');const on=()=>{const s=scrollY>hero.offsetHeight-90;hd.classList.toggle('scrolled',s);hd.classList.toggle('on-hero',!s);if(s){hd.classList.remove('hero-light','hero-dark')}else{setHeroHeaderTone(document.querySelector('.hero-slide.active'))}};addEventListener('scroll',on,{passive:true});on()}

const O=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('visible');O.unobserve(x.target)}}),{threshold:.1});document.querySelectorAll('.reveal').forEach(x=>O.observe(x));

const ar=document.querySelector('[data-archive]'),fr=document.querySelector('[data-filters]');if(ar&&fr){fr.querySelectorAll('button').forEach(b=>b.onclick=()=>{fr.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.filter;ar.innerHTML=(f==='ALL'?P:P.filter(p=>p.tags.includes(f))).map(card).join('');ar.querySelectorAll('.reveal').forEach(x=>O.observe(x))})}

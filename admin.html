<!doctype html><html lang="ko"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WE.YO CMS</title><style>
:root{--bg:#f5f4f0;--ink:#171717;--muted:#706e67;--line:#d7d3ca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1280px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 28px;border-bottom:1px solid var(--line)}h1{font:400 30px 'Times New Roman',serif;margin:0}.muted{color:var(--muted)}.tabs{display:flex;gap:26px;padding:22px 0}.tabs button{border:0;background:none;padding:0 0 6px;color:var(--muted)}.tabs button.active{color:var(--ink);border-bottom:1px solid}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 20px}.primary,.ghost{border:1px solid var(--ink);padding:10px 14px;background:var(--ink);color:#fff}.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.list{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:60px 1.7fr 1fr 80px 90px minmax(200px,auto);gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:13px}.title{font:400 20px 'Times New Roman',serif}.thumb{width:54px;height:40px;object-fit:cover;background:#ddd}.slots{display:grid;grid-template-columns:1fr 1fr;gap:28px}.card{background:#ffffff66;border:1px solid var(--line);padding:20px}.slot{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}label{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);background:#fff}textarea{min-height:100px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}dialog{width:min(920px,94vw);border:0;padding:0;background:var(--bg);box-shadow:0 24px 80px #0003}dialog::backdrop{background:#0007}.modal{padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.images{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.imgitem{position:relative;border:1px solid var(--line);background:#fff}.imgitem img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.imgitem button{position:absolute;right:5px;top:5px;border:0;background:#fff;padding:4px 7px}.login{max-width:420px;margin:14vh auto;background:#fff;padding:30px;border:1px solid var(--line)}.login h2{font:400 34px 'Times New Roman',serif}.field{margin:14px 0}.status{font-size:12px;margin-top:10px;color:var(--muted)}.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.mini{min-width:34px;padding:8px 10px}.danger{border-color:#b9aaa4;color:#8a3d32}@media(max-width:760px){.wrap{padding:18px}.slots,.grid2,.grid3{grid-template-columns:1fr}.row{grid-template-columns:46px 1fr auto;gap:10px}.row>*:nth-child(3),.row>*:nth-child(4),.row>*:nth-child(5){display:none}.actions{justify-content:flex-end}.actions .edit-label,.actions .delete-label{display:none}}
</style></head><body>
<div id="login" class="login" hidden><h2>WE.YO CMS</h2><p class="muted">관리자 로그인</p><div class="field"><label>EMAIL</label><input id="email" type="email" value="weyoarch@gmail.com"></div><button class="primary" id="loginBtn">SEND MAGIC LINK</button><div id="loginStatus" class="status"></div></div>
<div id="app" class="wrap" hidden><header><h1>WE.YO CMS</h1><div><span id="who" class="muted"></span> · <button class="ghost" id="logoutBtn">LOGOUT</button></div></header><nav class="tabs"><button data-tab="projects" class="active">Projects</button><button data-tab="homepage">Homepage</button></nav>
<section id="projects" class="panel active"><div class="toolbar"><div><b>Projects</b> <span id="count" class="muted"></span></div><button class="primary" id="newBtn">+ NEW PROJECT</button></div><div id="projectList" class="list"></div></section>
<section id="homepage" class="panel"><div class="toolbar"><div><b>Homepage</b><div class="muted">Hero와 Selected Works 노출을 관리해.</div></div><button class="primary" id="saveHome">SAVE HOMEPAGE</button></div><div class="slots"><div class="card"><h3>Hero</h3><p class="muted">프로젝트 / 우선순위</p><div id="heroSlots"></div><button class="ghost" id="addHero">+ HERO SLOT</button></div><div class="card"><h3>Selected Works</h3><p class="muted">메인 주요 콘텐츠 최대 5개</p><div id="selectedSlots"></div></div></div></section>
</div>
<dialog id="editor"><form class="modal" id="projectForm"><div class="modalhead"><h2 id="editorTitle" style="margin:0;font:400 30px 'Times New Roman',serif">Project</h2><button type="button" class="ghost" id="closeEditor">CLOSE</button></div><input type="hidden" id="pid"><div class="grid2"><div><label>TITLE</label><input id="title" required></div><div><label>SLUG</label><input id="slug" required></div><div><label>DISPLAY</label><input id="display"></div><div><label>LOCATION</label><input id="location"></div></div><div class="grid3" style="margin-top:16px"><div><label>YEAR</label><input id="year" type="number"></div><div><label>PROGRAM</label><input id="program"></div><div><label>STATUS</label><input id="status"></div><div><label>SITE AREA</label><input id="site"></div><div><label>GROSS FLOOR AREA</label><input id="gross"></div><div><label>LIST PRIORITY</label><input id="list_order" type="number"></div></div><div style="margin-top:16px"><label>TAGS (comma separated)</label><input id="tags"></div><div style="margin-top:16px"><label>DESCRIPTION</label><textarea id="description"></textarea></div><div style="margin-top:16px"><label><input id="is_published" type="checkbox" style="width:auto"> Published</label></div><div style="margin-top:16px"><label>PROJECT IMAGES</label><input id="projectUpload" type="file" accept="image/*" multiple><div id="projectImages" class="images"></div></div><div class="modalfoot"><button type="button" id="deleteBtn" class="ghost">DELETE</button><button type="submit" class="primary">SAVE</button></div></form></dialog>
<script src="/assets/media.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script>
const SB_URL='https://rmtfmegufylujrzuvczi.supabase.co',SB_KEY='sb_publishable_Zh_DVcw1aX3mUkCTQg8WLw_WNiPyuhz',sb=supabase.createClient(SB_URL,SB_KEY);let projects=[],editingImages=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),mediaUrl=window.WEYOMedia.mediaUrl;
async function checkAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return showLogin();const {data,error}=await sb.from('cms_admin_emails').select('email').eq('email',(user.email||'').toLowerCase()).maybeSingle();if(error||!data){await sb.auth.signOut();return showLogin('이 이메일은 CMS 관리자로 등록되지 않았어.')}showApp(user);await refreshAll()}
function showLogin(msg=''){$('#login').hidden=false;$('#app').hidden=true;$('#loginStatus').textContent=msg}function showApp(user){$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=user.email||''}
$('#loginBtn').onclick=async()=>{$('#loginStatus').textContent='';const email=$('#email').value.trim();const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});if(error)return $('#loginStatus').textContent=error.message;$('#loginStatus').textContent='메일함에서 WE.YO CMS 로그인 링크를 눌러줘.'};$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();showLogin()};
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('active',x===b));$$('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
async function refreshAll(){const {data,error}=await sb.from('projects').select('*').order('list_order');if(error)throw error;projects=data||[];renderProjects();await renderHomepage()}
function renderProjects(){
  $('#count').textContent='('+projects.length+')';
  $('#projectList').innerHTML=projects.map((p,i)=>`<div class="row">
    <img class="thumb" src="${esc(mediaUrl((p.images||[])[0]))}" alt="">
    <div><div class="title">${esc(p.title)}</div><div class="muted">${esc(p.slug)}</div></div>
    <div>${esc(p.location||'')}</div>
    <div>${esc(p.year||'')}</div>
    <div>${p.is_published?'Published':'Draft'}</div>
    <div class="actions">
      <button class="ghost mini" ${i===0?'disabled':''} onclick="moveProject('${p.id}',-1)" title="우선순위 올리기">↑</button>
      <button class="ghost mini" ${i===projects.length-1?'disabled':''} onclick="moveProject('${p.id}',1)" title="우선순위 내리기">↓</button>
      <button class="ghost" onclick="editProject('${p.id}')"><span class="edit-label">EDIT</span><span aria-hidden="true">✎</span></button>
      <button class="ghost danger" onclick="deleteProject('${p.id}')"><span class="delete-label">DELETE</span><span aria-hidden="true">×</span></button>
    </div>
  </div>`).join('')
}

window.moveProject=async(id,dir)=>{
  const i=projects.findIndex(p=>p.id===id),j=i+dir;
  if(i<0||j<0||j>=projects.length)return;
  const reordered=[...projects];
  [reordered[i],reordered[j]]=[reordered[j],reordered[i]];
  const updates=reordered.map((p,idx)=>sb.from('projects').update({list_order:idx+1}).eq('id',p.id));
  const results=await Promise.all(updates);
  const failed=results.find(r=>r.error);
  if(failed)return alert(failed.error.message);
  await refreshAll()
};

async function deleteProjectById(id,title='이 프로젝트'){
  if(!confirm(`${title}를 삭제할까?\n메인 Hero/Selected Works에 연결되어 있으면 함께 빠져.`))return false;
  let r=await sb.from('homepage_hero').delete().eq('project_id',id);
  if(r.error)return alert(r.error.message),false;
  r=await sb.from('homepage_selected').delete().eq('project_id',id);
  if(r.error)return alert(r.error.message),false;
  r=await sb.from('projects').delete().eq('id',id);
  if(r.error)return alert(r.error.message),false;
  await refreshAll();
  return true
}
window.deleteProject=id=>{
  const p=projects.find(x=>x.id===id);
  return deleteProjectById(id,p?.title||'이 프로젝트')
};

$('#newBtn').onclick=()=>openEditor();$('#closeEditor').onclick=()=>$('#editor').close();function openEditor(p=null){$('#projectForm').reset();$('#pid').value=p?.id||'';$('#editorTitle').textContent=p?'Edit Project':'New Project';for(const k of ['title','slug','display','location','year','program','status','site','gross','description','list_order'])$('#'+k).value=p?.[k]??'';$('#tags').value=(p?.tags||[]).join(', ');$('#is_published').checked=p?p.is_published:true;editingImages=[...(p?.images||[])];renderEditingImages();$('#deleteBtn').style.visibility=p?'visible':'hidden';$('#editor').showModal()}window.editProject=id=>openEditor(projects.find(p=>p.id===id));
function renderEditingImages(){$('#projectImages').innerHTML=editingImages.map((x,i)=>`<div class="imgitem"><img src="${esc(mediaUrl(x))}" alt=""><button type="button" onclick="removeImage(${i})">×</button></div>`).join('')}window.removeImage=i=>{editingImages.splice(i,1);renderEditingImages()};
async function uploadFiles(files,prefix='projects'){const out=[];for(const f of files){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${prefix}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('project-media').upload(path,f,{cacheControl:'3600',upsert:false});if(error)throw error;out.push(path)}return out}
$('#projectUpload').onchange=async e=>{try{editingImages.push(...await uploadFiles([...e.target.files]));renderEditingImages()}catch(err){alert(err.message)}e.target.value=''};
$('#projectForm').onsubmit=async e=>{e.preventDefault();const obj={title:$('#title').value.trim(),slug:$('#slug').value.trim(),display:$('#display').value.trim(),location:$('#location').value.trim(),year:+$('#year').value||null,program:$('#program').value.trim(),status:$('#status').value.trim(),site:$('#site').value.trim(),gross:$('#gross').value.trim(),description:$('#description').value.trim(),list_order:+$('#list_order').value||100,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),images:editingImages,is_published:$('#is_published').checked};const id=$('#pid').value;const q=id?sb.from('projects').update(obj).eq('id',id):sb.from('projects').insert(obj);const {error}=await q;if(error)return alert(error.message);$('#editor').close();await refreshAll()};
$('#deleteBtn').onclick=async()=>{
  const id=$('#pid').value;
  if(!id)return;
  const p=projects.find(x=>x.id===id);
  if(await deleteProjectById(id,p?.title||'이 프로젝트'))$('#editor').close()
};
const projectOptions=(selected='')=>'<option value="">— 선택 —</option>'+projects.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.title)}</option>`).join('');
async function renderHomepage(){
  const [h,s]=await Promise.all([
    sb.from('homepage_hero').select('*').order('slot'),
    sb.from('homepage_selected').select('*').order('slot')
  ]);
  const heroes=h.data||[];
  $('#heroSlots').innerHTML=(heroes.length?heroes:[1,2,3,4].map(slot=>({slot})))
    .map(x=>heroSlot(x.slot,x.project_id||'')).join('');
  const sel=s.data||[];
  $('#selectedSlots').innerHTML=[1,2,3,4,5].map(n=>{
    const x=sel.find(v=>v.slot===n);
    return selectedSlot(n,x?.project_id||'')
  }).join('')
}
function selectedSlot(slot,pid){
  return `<div class="slot" data-selected-wrap="${slot}">
    <b class="selectednum">${slot}</b>
    <select data-selected-slot="${slot}">${projectOptions(pid)}</select>
    <div style="display:grid;gap:4px">
      <button type="button" class="ghost" onclick="moveSelected(this,-1)">↑</button>
      <button type="button" class="ghost" onclick="moveSelected(this,1)">↓</button>
      <button type="button" class="ghost" onclick="clearSelected(this)">×</button>
    </div>
  </div>`
}
window.renumberSelected=()=>{
  $$('#selectedSlots .slot').forEach((el,i)=>{
    el.dataset.selectedWrap=i+1;
    el.querySelector('.selectednum').textContent=i+1;
    el.querySelector('select').dataset.selectedSlot=i+1
  })
};
window.moveSelected=(btn,dir)=>{
  const el=btn.closest('.slot'),box=$('#selectedSlots');
  if(dir<0&&el.previousElementSibling)box.insertBefore(el,el.previousElementSibling);
  if(dir>0&&el.nextElementSibling)box.insertBefore(el.nextElementSibling,el);
  renumberSelected()
};
window.clearSelected=btn=>{
  btn.closest('.slot').querySelector('select').value=''
};

function heroSlot(slot,pid){return `<div class="slot" data-hero-slot="${slot}"><b class="slotnum">${slot}</b><div><select class="hp">${projectOptions(pid)}</select><div class="muted" style="font-size:10px;margin-top:8px">대표 이미지 자동 사용</div></div><div style="display:grid;gap:4px"><button type="button" class="ghost" onclick="moveHero(this,-1)">↑</button><button type="button" class="ghost" onclick="moveHero(this,1)">↓</button><button type="button" class="ghost" onclick="this.closest('.slot').remove();renumberHero()">×</button></div></div>`}

window.renumberHero=()=>{$$('#heroSlots .slot').forEach((el,i)=>{el.dataset.heroSlot=i+1;el.querySelector('.slotnum').textContent=i+1})};
window.moveHero=(btn,dir)=>{const el=btn.closest('.slot'),box=$('#heroSlots');if(dir<0&&el.previousElementSibling)box.insertBefore(el,el.previousElementSibling);if(dir>0&&el.nextElementSibling)box.insertBefore(el.nextElementSibling,el);renumberHero()};
$('#addHero').onclick=()=>{const n=$$('#heroSlots .slot').length+1;if(n>12)return alert('Hero는 최대 12개까지');$('#heroSlots').insertAdjacentHTML('beforeend',heroSlot(n,''))};
$('#saveHome').onclick=async()=>{const heroes=$$('#heroSlots .slot').map((el,i)=>({slot:i+1,project_id:el.querySelector('.hp').value,is_enabled:true})).filter(x=>x.project_id);const selected=$$('[data-selected-slot]').map(el=>({slot:+el.dataset.selectedSlot,project_id:el.value})).filter(x=>x.project_id);let r=await sb.from('homepage_hero').delete().gte('slot',1);if(r.error)return alert(r.error.message);if(heroes.length){r=await sb.from('homepage_hero').insert(heroes);if(r.error)return alert(r.error.message)}r=await sb.from('homepage_selected').delete().gte('slot',1);if(r.error)return alert(r.error.message);if(selected.length){r=await sb.from('homepage_selected').insert(selected);if(r.error)return alert(r.error.message)}alert('Homepage 저장 완료');await renderHomepage()};
checkAdmin();
</script></body></html>
